<!doctype html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yami" />
    <meta name="application-name" content="Yami" />
    <meta property="og:site_name" content="Yami" />
    <link rel="canonical" href="https://mahirun019-dev.github.io/yami/" />
    <meta property="og:url" content="https://mahirun019-dev.github.io/yami/" />
    <script>
      (() => {
        const legacyBase = "/todo-apple-mobile";
        const path = window.location.pathname;
        if (path !== legacyBase && !path.startsWith(`${legacyBase}/`)) return;

        const params = new URLSearchParams(window.location.search);
        if (params.get("view") === "dashboard") {
          params.delete("view");
          params.delete("filter");
          params.delete("company");
        }
        params.delete("fresh-safari-tab");

        const target = new URL("/yami/", window.location.origin);
        target.search = params.toString();
        target.hash = window.location.hash;

        const redirect = () => window.location.replace(target.href);
        if (!("serviceWorker" in navigator)) {
          redirect();
          return;
        }

        const timeout = window.setTimeout(redirect, 400);
        void navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations
            .filter((registration) => registration.scope.startsWith(`${window.location.origin}${legacyBase}/`))
            .map((registration) => registration.unregister())))
          .catch(() => {})
          .finally(() => {
            window.clearTimeout(timeout);
            redirect();
          });
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" href="%BASE_URL%favicon.ico" type="image/x-icon" sizes="16x16 32x32" />
    <title>Yami</title>
    <style>
      html, body, #root { background-color: #f7f7f8; }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background-color: #000000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("careerflow-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          const root = document.documentElement;
          const themeColor = isDark ? "#000000" : "#f7f7f8";
          const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          root.dataset.theme = isDark ? "dark" : "light";
          root.dataset.displayMode = isStandalone ? "standalone" : "browser";
          try {
            const savedData = JSON.parse(localStorage.getItem("career-flow-data-v5") || "null");
            const fontSize = savedData?.preferences?.general?.fontSize;
            root.dataset.fontSize = ["small", "normal", "large"].includes(fontSize) ? fontSize : "normal";
          } catch {
            root.dataset.fontSize = "normal";
          }
          root.style.colorScheme = isDark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor);
          const statusBarStyle = isStandalone ? "black-translucent" : (isDark ? "black" : "default");
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute("content", statusBarStyle);
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
