<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yami" />
    <meta name="application-name" content="Yami" />
    <link rel="apple-touch-icon" href="/yami/icon-ab/b/apple-touch-icon.png" />
    <link rel="manifest" href="/yami/icon-ab/b/manifest.webmanifest" />
    <title>Yami Icon Test</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f7f7f8; color: #202124; }
      main { padding: 32px 24px; text-align: center; }
      img { width: 180px; height: 180px; object-fit: contain; }
      p { margin: 16px 0 0; font-size: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f2; } }
    </style>
  </head>
  <body>
    <main>
      <img src="apple-touch-icon.png" alt="Yami app icon" />
      <p>Yami Home Screen icon test</p>
    </main>
  </body>
</html>
